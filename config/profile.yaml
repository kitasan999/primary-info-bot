# あなたのプロフィール（通知フィルタ用）

role: 介護職（グループホーム）

context:
  region: 滋賀
  workplace: グループホーム
  job: 介護職
  interests:
    - NISA
    - 税制
    - お金

# つみたてNISAで積立中の商品名（部分一致で照合）
money:
  uses_nisa: true
  holdings:
    - eMAXIS Slim 全世界株式（オール・カントリー）
    - eMAXIS Slim 米国株式（S&P500）

priority_keywords:
  - つみたて
  - NISA
  - ニーサ
  - 所得税
  - 住民税
  - 税制
  - 確定申告
  - iDeCo
  - イデコ
  - 金利
  - 金融政策

interest_boost:
  - NISA
  - ニーサ
  - つみたて
  - 税制
  - 所得税
  - 住民税
  - 金利
  - 金融政策

min_score_to_notify: 3

# この件数を超えたら1通にまとめ通知
digest_threshold: 3

notify:
  decided: true
  discussing: false
  info: false
  unknown: false

# 感染症など重要な「資料更新」は関連度が高ければ通知
notify_high_relevance_info: true
high_relevance_info_threshold: 6

