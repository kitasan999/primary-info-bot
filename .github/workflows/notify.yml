name: 一次情報 → Discord 通知

on:
  schedule:
    # JST 07:00 = UTC 22:00（前日）
    - cron: "0 22 * * *"
    # JST 12:00 = UTC 03:00
    - cron: "0 3 * * *"
    # JST 20:00 = UTC 11:00
    - cron: "0 11 * * *"
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: コードを取得
        uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: 一次情報を取得して Discord に通知
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/notify.py
